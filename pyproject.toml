[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shipping-billing-assistant"
version = "0.1.0"
description = "Evidence-based shipping billing assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "langchain>=1,<2",
    "simplejson>=3.19,<5",
    "langchain-openai>=1,<2",
    "httpx>=0.28,<1",
    "pypdf>=5,<7",
    "pdfplumber>=0.11,<1",
    "pypdfium2>=4.18,<6",
    "pillow>=11,<13",
    "openpyxl>=3.1,<4",
    "xlrd>=2,<3",
    "olefile>=0.47,<1",
    "python-docx>=1.2,<2",
    "pywin32>=310 ; sys_platform == 'win32'",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "SQLAlchemy>=2.0.40,<2.1",
    "PyMySQL[rsa]>=1.1,<2",
]

[project.scripts]
shipping-billing = "shipping_billing.cli:main"
shipping-billing-web = "shipping_billing.web.server:main"
shipping-billing-db = "shipping_billing.storage.cli:main"

[project.optional-dependencies]
local-ocr = [
    "rapidocr-onnxruntime==1.4.4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "jsonschema>=4.23,<5",
    "ruff>=0.11,<1",
    "uv>=0.8,<1",
    "reportlab>=4,<5",
    "xlwt==1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shipping_billing.domain" = ["data/*.json"]
"shipping_billing.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
